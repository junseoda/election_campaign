services:
  - type: web
    name: election-campaign-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BACKEND_CORS_ORIGINS
        value: https://election-campaign-coral.vercel.app,https://election-campaign-junseodas-projects.vercel.app,https://election-campaign-git-main-junseodas-projects.vercel.app,http://localhost:3000,http://127.0.0.1:3000
